name: Render Deploy

# The native GitHub->Render webhook on srv-d7ff727aqgkc739pdch0 stopped firing
# despite Auto-Deploy=On Commit being configured in the Render dashboard.
# This workflow uses the Render deploy hook URL (stored as secret) as a
# reliable fallback trigger so every push to main triggers a deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  trigger-render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST to Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          echo "Commit: ${GITHUB_SHA}"
          echo "Triggering Render deploy..."
          RESP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP ${RESP}"
          cat /tmp/resp.json || true
          echo
          # 409 = a deploy is already in progress for this service (Render's native
          # auto-deploy already fired for this commit). That is success, not failure —
          # the redundant fallback hook just conflicts. Accept it instead of failing CI.
          if [ "$RESP" = "409" ]; then
            echo "::notice::Render returned 409 — a deploy is already in progress (native auto-deploy is handling ${GITHUB_SHA}). Treating as success."
            exit 0
          fi
          if [ "$RESP" != "200" ] && [ "$RESP" != "201" ]; then
            echo "::error::Render deploy hook returned non-2xx status ${RESP}"
            exit 1
          fi
          echo "::notice::Render deploy triggered for commit ${GITHUB_SHA}"
