name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit --project tsconfig.modules.json

  build:
    name: Build
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
        env:
          ANTHROPIC_API_KEY: sk-test-stub-for-ci
          JWT_SECRET: test-jwt-secret-for-ci

  lint:
    name: Lint (informational)
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # 4 pre-existing errors in untouched files — reported but does not block.
      - run: npm run lint -- --max-warnings 250

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  fly-staging-config-guard:
    name: Fly staging config anti-regression guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # No Node dependencies required — the script only reads checked-in
      # config/workflow text, so no `npm ci` needed for this gate.
      - run: node scripts/validate-fly-staging-config.mjs

  feature-truth-guard:
    name: feature-truth-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Coverage guard reads source text only — no deps needed.
      - run: node scripts/validate-capability-registry.mjs
      # Semantic honesty invariants (needs the TS registry imported).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run src/__tests__/config/capabilityRegistry.test.ts
