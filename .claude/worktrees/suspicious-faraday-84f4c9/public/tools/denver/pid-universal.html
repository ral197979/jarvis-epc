<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PFD Generator — Denver Suite</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f9fafb;color:#111;font-size:13px}
#toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:#FAEEDA;color:#854F0B;flex-shrink:0}
label{font-size:11px;color:#6b7280;display:block;margin-bottom:3px}
select,input[type=text]{font-size:12px;padding:5px 8px;border:1px solid #d1d5db;border-radius:5px;background:#fff;color:#111;height:30px}
.btn{font-size:12px;font-weight:600;padding:0 12px;height:30px;border:none;border-radius:5px;cursor:pointer;flex-shrink:0}
.btn-gen{background:#3b82f6;color:#fff}.btn-gen:hover{background:#2563eb}.btn-gen:disabled{background:#93c5fd;cursor:not-allowed}
.btn-save{background:#059669;color:#fff}.btn-save:hover{background:#047857}
.status{font-size:11px;color:#6b7280;flex:1;text-align:right}
.status.ok{color:#059669}.status.err{color:#dc2626}
#canvas-area{padding:16px;overflow:auto;min-height:calc(100vh - 58px)}
#pid-output{background:#fff;border:1px solid #e5e7eb;border-radius:8px;min-height:480px;padding:12px;overflow:auto}
#pid-output svg{max-width:100%;height:auto}
#empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:480px;color:#9ca3af;gap:8px}
#empty-state .icon{font-size:48px}
</style>
</head>
<body>
<div id="toolbar">
  <span class="badge">PFD</span>
  <div>
    <label>Discipline</label>
    <select id="discipline">
      <option value="mech">Mechanical</option>
      <option value="hvac">HVAC / Chilled Water</option>
      <option value="plumbing">Plumbing</option>
      <option value="process">Process / Chemical</option>
      <option value="water">Water Treatment</option>
      <option value="wwtp">Wastewater Treatment</option>
    </select>
  </div>
  <div>
    <label>Project name</label>
    <input type="text" id="proj-name" value="New Project" style="width:180px">
  </div>
  <div>
    <label>Drawing no.</label>
    <input type="text" id="dwg-no" value="PFD-001" style="width:90px">
  </div>
  <button class="btn btn-gen" id="gen-btn" onclick="generate()">Generate PFD</button>
  <button class="btn btn-save" id="save-btn" onclick="sendToJarvis()" style="display:none">Save to Jarvis ↗</button>
  <span class="status" id="status"></span>
</div>

<div id="canvas-area">
  <div id="pid-output">
    <div id="empty-state">
      <span class="icon">📐</span>
      <p>Select discipline and project, then click <strong>Generate PFD</strong></p>
    </div>
  </div>
</div>

<script src="UNIVERSAL-PID-GENERATOR.js"></script>
<script>window.DENVER_TOOL_ID='pid-universal';window.DENVER_TOOL_VERSION='v3.5'</script>
<script src="denver-bridge.js"></script>
<script>
var lastSvg=null

document.addEventListener('jarvis:context',function(e){
  if(e.detail.projectName) document.getElementById('proj-name').value=e.detail.projectName
})

function setStatus(msg,type){var el=document.getElementById('status');el.textContent=msg;el.className='status '+(type||'')}

function generate(){
  var disc=document.getElementById('discipline').value
  var name=document.getElementById('proj-name').value
  var dwg=document.getElementById('dwg-no').value
  document.getElementById('gen-btn').disabled=true
  setStatus('Generating…')
  try{
    var svg=null
    if(typeof generatePFD==='function')        svg=generatePFD(disc,name,dwg)
    else if(typeof PIDGenerator==='function')  svg=new PIDGenerator().generate(disc,name,dwg)
    else if(typeof DenverPFD!=='undefined')    svg=DenverPFD.generate(disc,name,dwg)
    else { svg=_fallback(name,disc,dwg); console.warn('[pid-universal] generator not found — fallback') }
    if(!svg) throw new Error('Generator returned empty SVG')
    var es=document.getElementById('empty-state')
    if(es) es.style.display='none'
    document.getElementById('pid-output').innerHTML=svg
    lastSvg=svg
    document.getElementById('save-btn').style.display='inline-flex'
    setStatus('PFD generated ✓','ok')
  }catch(err){setStatus('Error: '+err.message,'err');console.error(err)}
  finally{document.getElementById('gen-btn').disabled=false}
}

function sendToJarvis(){
  if(!lastSvg)return
  window.JARVIS_SEND_RESULT({discipline:document.getElementById('discipline').value,project:document.getElementById('proj-name').value,drawing_no:document.getElementById('dwg-no').value,tool:'PFD Generator'},lastSvg)
  setStatus('Sent to Jarvis ✓','ok')
}

function _fallback(name,disc,dwg){
  return '<svg width="700" height="220" xmlns="http://www.w3.org/2000/svg">'
    +'<rect width="700" height="220" fill="#f9fafb" rx="8"/>'
    +'<rect x="1" y="1" width="698" height="218" fill="none" stroke="#d1d5db" stroke-width="1" rx="8"/>'
    +'<text x="350" y="80" font-family="system-ui" font-size="16" fill="#374151" text-anchor="middle" font-weight="600">'+name+'</text>'
    +'<text x="350" y="108" font-family="system-ui" font-size="13" fill="#6b7280" text-anchor="middle">'+disc.toUpperCase()+' — Process Flow Diagram | '+dwg+'</text>'
    +'<text x="350" y="165" font-family="system-ui" font-size="11" fill="#d1d5db" text-anchor="middle">UNIVERSAL-PID-GENERATOR.js loaded from /tools/denver/</text>'
    +'</svg>'
}
</script>
</body>
</html>
