<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JARVIS EPC — AI-powered Engineering, Procurement & Construction Platform" />
    <meta name="theme-color" content="#08090d" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect to Anthropic API for faster AI responses -->
    <link rel="preconnect" href="https://api.anthropic.com" />

    <!-- App title -->
    <title>JARVIS EPC v4</title>

    <!-- Base styles to prevent flash of unstyled content -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #08090d;
        color: #e8ecf4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      /* Loading state shown before React mounts */
      #root:empty::after {
        content: '';
        display: block;
        width: 32px;
        height: 32px;
        border: 2px solid #1e2230;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker for offline shell + online-sync nudge.
      // Disabled in dev (localhost on the Vite port) to avoid stale caching
      // during hot-reload — enable once the app is deployed.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
