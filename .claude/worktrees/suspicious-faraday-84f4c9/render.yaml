databases:
  - name: jarvis-epc-db
    databaseName: jarvis_epc
    plan: basic-256mb
    postgresMajorVersion: '16'

services:
  - type: web
    name: jarvis-epc
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run api:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: SERVE_STATIC
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-epc-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: '10000'
