version: '3.9'

# ============================================================
# JARVIS EPC v4.26.0 — Production Stack
#
# Services:
#   postgres  — PostgreSQL 16 (primary database)
#   redis     — Redis 7 (token store + rate limit cache)
#   api       — Node.js backend API
#   frontend  — Vite/React SPA served via nginx
#
# Quick start:
#   1. cp .env.example .env
#   2. Fill in required secrets (DB_PASSWORD, JWT_SECRET, etc.)
#   3. docker compose up -d
#   4. docker compose logs -f api   # watch migrations + startup
#
# Production notes:
#   - Use a managed PostgreSQL service (Neon, Supabase, RDS) and set DATABASE_URL
#     instead of the embedded postgres service for production-grade HA.
#   - Use a managed Redis service (Upstash, ElastiCache) and set REDIS_URL.
#   - Set STORAGE_BACKEND=s3 and configure S3_* env vars for file storage.
#   - Put a CDN / load balancer in front of the frontend service.
# ============================================================

services:

  # ────────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_epc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-jarvis_epc}
      POSTGRES_USER:     ${DB_USER:-jarvis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${DB_USER:-jarvis} -d ${DB_NAME:-jarvis_epc}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    networks:
      - internal
    # Port NOT exposed to public; only accessible within internal network.
    # Uncomment for local dev DB access:
    # ports:
    #   - "5432:5432"

  # ────────────────────────────────────────────────────────────
  # Redis 7
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jarvis_epc_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - internal
    # Uncomment for local dev Redis access:
    # ports:
    #   - "6379:6379"

  # ────────────────────────────────────────────────────────────
  # API — Node.js + Express + TypeScript
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context:    .
      dockerfile: Dockerfile.api
    container_name: jarvis_epc_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:      production
      PORT:          3001

      # Database
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME:-jarvis_epc}
      DB_USER:       ${DB_USER:-jarvis}
      DB_PASSWORD:   ${DB_PASSWORD}
      DB_POOL_MIN:   2
      DB_POOL_MAX:   20

      # Redis (token store)
      REDIS_URL:     redis://:${REDIS_PASSWORD}@redis:6379

      # Auth
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET is required}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.jarvis.yourdomain.com}

      # AI Gateway
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Storage
      STORAGE_BACKEND:   ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      S3_BUCKET:         ${S3_BUCKET:-}
      S3_ENDPOINT:       ${S3_ENDPOINT:-}
      AWS_REGION:        ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # App
      LOG_LEVEL:     ${LOG_LEVEL:-info}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://api.jarvis.yourdomain.com}

    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads   # local file storage (ignored if STORAGE_BACKEND=s3)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public
    healthcheck:
      test:     ["CMD-SHELL", "curl -sf http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s

  # ────────────────────────────────────────────────────────────
  # Frontend — React + Vite (nginx)
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context:    .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BACKEND_URL:     ${VITE_BACKEND_URL:-http://localhost:3001}
        VITE_GATEWAY_MODE:    proxied
        VITE_APP_VERSION:     4.26.0
        VITE_APP_ENV:         production
        VITE_ENABLE_AI_CHAT:  ${VITE_ENABLE_AI_CHAT:-true}
    container_name: jarvis_epc_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - api
    networks:
      - public
    healthcheck:
      test:     ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3

# ────────────────────────────────────────────────────────────────────────────────
# Development Extras (uncomment to enable)
# ────────────────────────────────────────────────────────────────────────────────

  # pgAdmin — PostgreSQL GUI
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL:    admin@jarvis.local
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - internal
  #   depends_on:
  #     - postgres

  # Redis Commander — Redis GUI
  # redis-commander:
  #   image: rediscommander/redis-commander:latest
  #   environment:
  #     REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - internal
  #   depends_on:
  #     - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  internal:        # DB + Redis — never exposed to public internet
    internal: true
  public:          # API + Frontend — internet-facing
