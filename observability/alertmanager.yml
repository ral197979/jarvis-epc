# Denver Engineering — Alertmanager routing + escalation (OPS-003)
# Validated with `amtool check-config`. Receiver URLs are operator secrets
# (set via env / file_sd) — placeholders here are intentional.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h            # alert persistence / re-notify cadence
  routes:
    - matchers: [ 'severity="critical"' ]
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h         # escalation: critical re-pages hourly until resolved
      continue: true
    - matchers: [ 'severity="warning"' ]
      receiver: slack-warnings
      repeat_interval: 6h

receivers:
  - name: default
    # no-op catch-all; real routes below
  - name: pagerduty-critical
    pagerduty_configs:
      # Operator provides the routing key via this mounted secret file.
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        severity: critical
  - name: slack-warnings
    slack_configs:
      # Operator provides the webhook URL via this mounted secret file.
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: '#denver-alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # A full app-down should suppress the downstream high-error-rate noise.
  - source_matchers: [ 'alertname="ApplicationUnavailable"' ]
    target_matchers: [ 'alertname="HighErrorRate"' ]
    equal: ['service']
